[project]
name = "buttle"
version = "0.3.0"
description = "Command-line utilities for DNA and protein sequence analysis. At your service."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.15"
dependencies = [
    "pillow>=12.3.0",
    "buttle-rust",
]

[project.scripts]
buttle = "buttle.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "maturin>=1.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
buttle-rust = { path = "./rust" }

[tool.pytest.ini_options]
addopts = [
    "--cov=buttle",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-vv",
]